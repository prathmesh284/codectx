[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codectx"
version = "1.0.0"
description = "Advanced code analysis tool for project context extraction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Prathmesh", email = "prathmesh@example.com"},
]
keywords = ["code-analysis", "context-extraction", "project-analysis", "code-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "python-dotenv>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/prathmesh284/codectx"
Documentation = "https://github.com/prathmesh284/codectx/wiki"
Repository = "https://github.com/prathmesh284/codectx.git"
Issues = "https://github.com/prathmesh284/codectx/issues"

[project.scripts]
codectx = "codectx.main:main"
codectx-setup = "bootstrap:main"

[tool.setuptools]
include-package-data = true
py-modules = ["bootstrap"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codectx", "codectx.*"]
