[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycodectx"
version = "1.0.2"
description = "Project context extraction tool for code analysis and AI workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Prathmesh"},
]
maintainers = [
    {name = "Prathmesh"},
]
keywords = [
    "code-analysis",
    "context-extraction",
    "developer-tools",
    "documentation",
    "project-analysis",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "python-dotenv>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/prathmesh284/codectx"
Documentation = "https://github.com/prathmesh284/codectx#readme"
Repository = "https://github.com/prathmesh284/codectx.git"
Issues = "https://github.com/prathmesh284/codectx/issues"

[project.scripts]
codectx = "codectx.main:main"
codectx-setup = "codectx.setup:main"

[tool.setuptools]
include-package-data = true
py-modules = ["bootstrap"]
license-files = ["LICENSE"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codectx", "codectx.*"]
